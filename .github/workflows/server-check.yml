name: Server check

# 배포된 Supabase 판별 함수가 실제로 동작하는지 확인한다.
# 익명 로그인 → 위키백과 사진으로 identify 호출 → 결과 출력.
#  - 칠성무당벌레: 기본 도감 종
#  - 동박새: 기본 도감 밖 종(확장 도감 생성 확인)
# 실행할 때마다 Anthropic API 사용료가 사진 수만큼 든다.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/server-check.yml.manual-only'
  workflow_dispatch:
    inputs:
      pages:
        description: '시험할 위키백과(영문) 문서 이름들, 공백으로 구분'
        default: 'Coccinella_septempunctata Warbling_white-eye'

env:
  SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://fkhcflvpsspgshqqsbai.supabase.co' }}
  SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_9fO4i-9a0RgCSHYPZfl0_A_oqxoD7w1' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Anonymous sign-in
        run: |
          RES=$(curl -sS -X POST "$SUPABASE_URL/auth/v1/signup" -H "apikey: $SUPABASE_KEY" -H "content-type: application/json" -d '{}')
          TOKEN=$(echo "$RES" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then echo "익명 로그인 실패: $RES"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "익명 로그인 성공"

      - name: Setup status (AI 비용 없음)
        run: |
          H=(-H "apikey: $SUPABASE_KEY" -H "authorization: Bearer $TOKEN")
          FB=$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" "$SUPABASE_URL/rest/v1/feedback?select=id&limit=1")
          EXT=$(curl -s -o fb.json -w '%{http_code}' "${H[@]}" "$SUPABASE_URL/rest/v1/species?select=id&kind=eq.ext&limit=5"); EXTN=$(jq 'length' fb.json 2>/dev/null)
          ST=$(curl -s -o st.json -w '%{http_code}' -X POST -H "apikey: $SUPABASE_KEY" -H "authorization: Bearer $SUPABASE_KEY" -H 'x-stats-token: wrong-token-for-check' "$SUPABASE_URL/functions/v1/stats")
          echo "feedback 테이블: HTTP $FB (200이면 있음)"
          echo "species.kind 열(확장 도감): HTTP $EXT, 확장 종 ${EXTN}개"
          echo "stats 함수: HTTP $ST $(cat st.json) (401=배포+토큰 설정됨, 503=토큰 미설정, 404=미배포)"
          {
            echo "## 설정 상태"
            echo "- feedback 테이블: HTTP $FB"
            echo "- 확장 도감 열: HTTP $EXT (확장 종 ${EXTN}개)"
            echo "- stats 함수: HTTP $ST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Identify test photos
        if: ${{ inputs.pages != 'none' }}
        run: |
          UA="realdex-server-check/1.0 (github.com/ilrutto2-cmd/realdex)"
          FAIL=0
          for PAGE in ${{ inputs.pages || 'Coccinella_septempunctata Warbling_white-eye' }}; do
            echo "===== $PAGE ====="
            THUMB=$(curl -sSL -A "$UA" "https://en.wikipedia.org/api/rest_v1/page/summary/$PAGE?redirect=true" | jq -r '.thumbnail.source // empty')
            if [ -z "$THUMB" ]; then echo "문서에 사진이 없습니다: $PAGE"; FAIL=1; continue; fi
            curl -sSL -A "$UA" "$THUMB" -o photo.jpg || true
            if ! file photo.jpg | grep -q JPEG; then echo "사진을 받지 못했습니다: $THUMB"; FAIL=1; continue; fi
            jq -n --arg b "$(base64 -w0 photo.jpg)" '{image_base64:$b, media_type:"image/jpeg"}' > body.json
            CODE=$(curl -sS -o out.json -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/identify" \
              -H "apikey: $SUPABASE_KEY" -H "authorization: Bearer $TOKEN" -H "content-type: application/json" --data @body.json)
            echo "HTTP $CODE"
            jq . out.json || cat out.json
            {
              echo "## $PAGE: HTTP $CODE"
              echo '```json'; jq . out.json 2>/dev/null || cat out.json; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            [ "$CODE" = "200" ] || FAIL=1
          done
          exit $FAIL
