name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 빌드 서버(ubuntu-latest)에 미리 설치된 Android SDK를 쓴다.
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install packages
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          # 앱에 들어가는 공개용 값(Supabase 주소, publishable key). 비밀값이 아니다.
          # 바꾸려면 저장소 Settings → Variables에 같은 이름으로 넣는다.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://fkhcflvpsspgshqqsbai.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_9fO4i-9a0RgCSHYPZfl0_A_oqxoD7w1' }}

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://fkhcflvpsspgshqqsbai.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_9fO4i-9a0RgCSHYPZfl0_A_oqxoD7w1' }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk REALDEX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: REALDEX-apk
          path: REALDEX.apk
          retention-days: 30

      # 휴대폰에서 바로 내려받을 수 있도록 릴리스 페이지에도 올린다.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" REALDEX.apk \
            --title "REALDEX 안드로이드 앱 (빌드 ${{ github.run_number }})" \
            --notes "REALDEX.apk를 눌러 내려받은 뒤 설치하세요. 처음 설치할 때 '출처를 알 수 없는 앱 설치'를 허용해야 합니다." \
            --latest
